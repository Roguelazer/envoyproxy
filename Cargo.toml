[package]
name = "envoyproxy"
version = "0.1.0"
edition = "2024"
license = "ISC"
description = "Proxy that summarizes the output from Enphase Envoy"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["cargo", "derive", "env"] }
idna_adapter = "=1.1.0"
itertools = "0.15.0"
jiff = { version = "1.0", features = ["serde"] }
promformat = { version = "0.4.1", features = ["jiff"] }
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "json", "http2", "native-tls"] }
rusqlite = { version = "0.43.0", features = [] }
rustfs-mimalloc = "0.7"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[patch.crates-io]
promformat = { git = "https://github.com/Roguelazer/promformat", rev = "c00344543fe9155c290319ca2641017642b5ec5a" }
