name: "Test"
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    name: "Run tests"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --all-features
  formatting:
    name: "Check formatting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
  prek:
    name: Validate prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v7.6.0
      - uses: j178/prek-action@v3.1.0
      - name: Verify the workflow lockfile
        uses: j178/prek-action@v3.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          extra-args: "--hook-stage manual gh-actions-lock-verify --all-files"
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.1.3
